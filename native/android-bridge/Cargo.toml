[package]
name = "tauri-plugin-android-bridge"
version = "0.1.0"
description = "Android SAF, Keystore, sharing and reader lifecycle bridge for Granite"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
links = "tauri-plugin-android-bridge"

[lib]
name = "tauri_plugin_android_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
