name: Android

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*-android"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri CLI 2.12.4 installs and compiles Android SDK 37 and NDK 29.
  ANDROID_COMPILE_SDK: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "29.0.13846066"

jobs:
  debug:
    name: Checks and Debug APK
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Create reader test fixtures
        run: node scripts/create-fixtures.mjs

      - name: Build plugin example fixture
        run: node packages/core/examples/basic-plugin/build.mjs

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Initialize Android project when absent
        run: |
          if [[ ! -f src-tauri/gen/android/app/build.gradle.kts ]]; then
            npx tauri android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew

      - name: Build Debug APK
        run: npx tauri android build --debug --apk --target aarch64 --ci

      - name: Test Android bridge
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-android-bridge:testDebugUnitTest --no-daemon

      - name: Inspect and checksum Debug APK
        run: bash scripts/android-verify-apk.sh debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: granite-android-debug-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            artifacts/android/debug/SHA256SUMS
            artifacts/android/debug/*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Signed Candidate APK' || 'Signed Release APK' }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Create reader test fixtures
        run: node scripts/create-fixtures.mjs

      - name: Build plugin example fixture
        run: node packages/core/examples/basic-plugin/build.mjs

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Initialize Android project when absent
        run: |
          if [[ ! -f src-tauri/gen/android/app/build.gradle.kts ]]; then
            npx tauri android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew

      - name: Configure release signing from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-configure-signing.mjs

      - name: Build signed Release APK
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Test Android bridge
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-android-bridge:testDebugUnitTest --no-daemon

      - name: Verify release signature and inspect APK
        run: bash scripts/android-verify-apk.sh release signed

      - name: Prepare signed APK asset bundle
        run: |
          mkdir -p artifacts/android/release-assets
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*' -name '*.apk' | sort | head -n 1)"
          test -n "$APK"

          VERSION="$(
            node -e \
              "const fs = require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)"
          )"
          test -n "$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            ASSET_NAME="Granite-${VERSION}-candidate-aarch64.apk"
          else
            ASSET_NAME="Granite-${VERSION}-android-aarch64.apk"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              RELEASE_TAG="$GITHUB_REF_NAME"
            else
              RELEASE_TAG="v${VERSION}-android"
            fi
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi

          cp "$APK" "artifacts/android/release-assets/$ASSET_NAME"
          cp artifacts/android/release/*.txt artifacts/android/release-assets/
          (
            cd artifacts/android/release-assets
            sha256sum "$ASSET_NAME" > SHA256SUMS.android
          )
          echo "SIGNED_APK_ASSET=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Summarize signed APK artifact
        run: |
          {
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "Signed candidate APK only. This run does not create a GitHub Release."
            else
              echo "Signed tag release APK. The release is created only after verification succeeds."
            fi
            echo
            echo "- Asset: \`$SIGNED_APK_ASSET\`"
            echo "- Checksum: \`artifacts/android/release-assets/SHA256SUMS.android\`"
            echo "- Manifest evidence: \`artifacts/android/release-assets/apk-*-manifest.txt\`"
            echo "- Signature inspection: \`artifacts/android/release-assets/apk-inspection.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: granite-android-signed-${{ github.event_name == 'workflow_dispatch' && 'candidate' || 'release' }}-${{ github.sha }}
          path: artifacts/android/release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android GitHub Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Granite $RELEASE_TAG (Android ARM64)" \
              --notes "Android ARM64 release. Windows has its own platform release." || \
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            artifacts/android/release-assets/*.apk \
            artifacts/android/release-assets/SHA256SUMS.android \
            --repo "$GITHUB_REPOSITORY" --clobber
