[package]
name = "granite"
version = "0.1.0"
description = "Granite native host"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"

[lib]
name = "granite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.9.3", features = [] }
tauri-plugin-android-bridge = { path = "../native/android-bridge" }
tauri-plugin-dialog = "2.8.4"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
walkdir = "2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

